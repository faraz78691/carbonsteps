<div class="ct_login_main" [class.disabled]="isLoading">
   
<div class="container">
        <div class="row">
            <div class="col-lg-12 mx-auto">
                <div class="ct_login_inner_bg">
                    <div class="ct_login_left">
                        <img
                            src="assets/img/log_in_left_22.png"
                            class="img-fluid"
                        />
                    </div>
                    <div class="cti_login_right_56">
                        <div class="pt-2">
                            <div class="text-center pt-2">
                                <img
                                    src="assets/img/Carbontek.png"
                                    style="object-fit: contain"
                                />
                                <!-- <img src="assets/img/ekobon.png" style="object-fit: contain;" style="justify-items: center" /> -->
                            </div>
                            <h2 class="text-center ct_fw_600 ct_fs_35">
                               Forgot Your Password?
                            </h2>
                            <p class="text-center">
                                You forgot your password? Here you can easily <br> retrieve a new
                        password.
                            </p>

                          <form #fForm="ngForm" (ngSubmit)="onSubmit(fForm)" class="mt-5">
                        <div class="form-group ">
                            <label>Registered Email</label>
                            <input type="text" name="useremail" #useremail="ngModel" [(ngModel)]="forgotData.email" placeholder="Enter your registered email"
                                class="form-control ct_input" style="background-color: transparent" required email />
                                <p *ngIf="useremail.invalid && useremail.touched" class="text-danger mt-1">Email is required</p>
                            

                        </div>

                        <div class="row">
                            <div class="col-12 pt-4 d-flex justify-content-center">
                                <button class="ct_login_btn" type="submit" [disabled]="!fForm.valid">
                                    Request new password
                                </button>
                            </div>
                        </div>
                                                    <p class="text-center mt-3">Already know your password? <a href="javascript:void(0)"  routerLink="/login">Login</a></p>

                    </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
